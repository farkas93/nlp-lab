[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-lab-training"
version = "0.1.4"
description = "Lightweight training submission, execution contracts and runtime profiles"
requires-python = ">=3.10"
dependencies = ["boto3>=1.42,<2", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
provisioning = ["uv==0.9.18"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
nlp-training-smoke = "nlp_training.smoke:main"
nlp-training-provision = "nlp_training.provision:main"

[tool.setuptools.packages.find]
include = ["nlp_training*"]

[tool.setuptools.package-data]
nlp_training = ["profiles/*.txt", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
